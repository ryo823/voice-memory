[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-memory"
version = "0.1.0"
description = "Voice knowledge database with an stdio MCP server"
requires-python = ">=3.11"
dependencies = ["mcp>=2.3,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
voice-memory-mcp = "voice_memory.mcp_server:main"
voice-memory-init = "voice_memory.database:init_cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
